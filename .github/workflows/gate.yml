name: Gate

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      oci_targets: ${{ steps.release-unit-impact.outputs.oci_targets }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devcenter_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devcenter_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEV_CENTER_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/devcenter_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected OCI release units
        id: release-unit-impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" | bash ci/release-unit-impact.sh >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = push ] && [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep --quiet '^0\{40\}$'; then
            git diff --name-only -z "$BEFORE_SHA..$HEAD_SHA" | bash ci/release-unit-impact.sh >> "$GITHUB_OUTPUT"
          else
            bash ci/release-unit-impact.sh --all >> "$GITHUB_OUTPUT"
          fi
      - name: Check release-unit impact classifier
        run: bash ci/check-release-unit-impact.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - name: Authenticate private sibling dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          authenticated="https://x-access-token:${TOKEN}@github.com/beyond10x/"
          git config --global url."${authenticated}".insteadOf "https://github.com/beyond10x/"
          git config --global --add url."${authenticated}".insteadOf "ssh://git@github.com/beyond10x/"
          git config --global --add url."${authenticated}".insteadOf "git@github.com:beyond10x/"
      - name: Install pinned frontend toolchain
        run: npm install --global pnpm@11.25.0
      - name: Build and test Vue application
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend test:e2e
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Install pinned ESS compiler
        env:
          ESS_REPOSITORY: ${{ github.repository_owner }}/ess
          ESS_VERSION: 0.9.2
        run: |
          archive="ess-${ESS_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/${ESS_REPOSITORY}/releases/download/${ESS_VERSION}/${archive}"
          echo '9b973b26679be3e4b822b8fb6aab37833ca96b3cdc46141318583e1939ec3120  /tmp/ess-0.9.2-x86_64-unknown-linux-gnu.tar.gz' | sha256sum --check
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp
          sudo install "/tmp/ess-${ESS_VERSION}-x86_64-unknown-linux-gnu/ess" /usr/local/bin/ess
      - name: Validate ESS sources and generated build inputs
        run: bash ci/check-ess-model.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Gate composed Connectors workspace
        run: |
          cargo fmt --manifest-path crates/devcenter-connectors/Cargo.toml --all --check
          cargo clippy --manifest-path crates/devcenter-connectors/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path crates/devcenter-connectors/Cargo.toml --locked
      - run: bash ci/check-version-consistency.sh
      - run: helm lint deploy/charts/devcenter --values deploy/charts/devcenter/ci/test-values.yaml
      - run: bash ci/check-chart-rollouts.sh
      - name: Scan generic test markers
        run: cargo run --locked --bin devcenterctl -- leak-check --root . --deny-file ci/denylist.example
      - name: Scan confidential markers
        env:
          CONFIDENTIAL_MARKERS: ${{ secrets.CONFIDENTIAL_MARKERS }}
        run: |
          marker_file=$(mktemp)
          trap 'rm -f "$marker_file"' EXIT
          printf '%s\n' "$CONFIDENTIAL_MARKERS" > "$marker_file"
          cargo run --locked --bin devcenterctl -- leak-check --root . --deny-file "$marker_file"
  affected-oci:
    name: Build affected OCI release units
    needs: gate
    if: needs.gate.result == 'success' && needs.gate.outputs.oci_targets != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - name: Build affected OCI targets
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          OCI_TARGETS: ${{ needs.gate.outputs.oci_targets }}
        run: |
          read -r -a targets <<< "$OCI_TARGETS"
          docker buildx bake --file docker-bake.hcl \
            "${targets[@]}" \
            --load \
            --set '*.platform=linux/amd64' \
            --set '*.secrets=id=github-token,env=TOKEN' \
            --set 'server.tags=devcenter:gate' \
            --set 'connectors.tags=devcenter-connectors:gate' \
            --set 'deployment-cli.tags=devcenterctl:gate'
          if [[ " $OCI_TARGETS " == *' connectors '* ]]; then
            docker run --rm devcenter-connectors:gate --version
          fi
          if [[ " $OCI_TARGETS " == *' deployment-cli '* ]]; then
            docker run --rm devcenterctl:gate --version
          fi
      - name: Smoke-test documented server container
        if: contains(format(' {0} ', needs.gate.outputs.oci_targets), ' server ')
        env:
          OCI_TARGETS: ${{ needs.gate.outputs.oci_targets }}
        run: |
          container=$(docker run --detach --rm \
            --publish 127.0.0.1::8080 \
            --env DEV_CENTER_LISTEN=0.0.0.0:8080 \
            --env DEV_CENTER_TENANT_ID=local \
            --env DEV_CENTER_PUBLIC_ORIGIN=http://127.0.0.1:8080 \
            devcenter:gate)
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.Config.WorkingDir}}' "$container")" = /var/lib/devcenter
          docker exec "$container" sh -c 'test -w /var/lib/devcenter'
          mapping=$(docker port "$container" 8080/tcp)
          port=${mapping##*:}
          for _ in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          docker logs "$container" >&2
          exit 1
