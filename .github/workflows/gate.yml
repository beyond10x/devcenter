name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
      - name: Authenticate Cargo git dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "ssh://git@github.com/beyond10x/"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: helm lint deploy/charts/devcenter --values deploy/charts/devcenter/ci/test-values.yaml
      - run: helm lint deploy/charts/devcenter --values deploy/charts/devcenter/ci/vault-values.yaml
      - run: helm template devcenter deploy/charts/devcenter --values deploy/charts/devcenter/ci/test-values.yaml >/dev/null
      - run: helm template devcenter deploy/charts/devcenter --values deploy/charts/devcenter/ci/vault-values.yaml >/dev/null
      - name: Scan generic test markers
        run: cargo run --locked --bin devcenterctl -- leak-check --root . --deny-file ci/denylist.example
      - name: Scan confidential markers
        env:
          CONFIDENTIAL_MARKERS: ${{ secrets.CONFIDENTIAL_MARKERS }}
        run: |
          marker_file=$(mktemp)
          trap 'rm -f "$marker_file"' EXIT
          printf '%s\n' "$CONFIDENTIAL_MARKERS" > "$marker_file"
          cargo run --locked --bin devcenterctl -- leak-check --root . --deny-file "$marker_file"
      - name: Build both OCI targets
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          docker build --secret id=github_token,env=TOKEN --target server --tag devcenter:gate .
          docker build --secret id=github_token,env=TOKEN --target ctl --tag devcenterctl:gate .
          docker run --rm devcenterctl:gate --version
