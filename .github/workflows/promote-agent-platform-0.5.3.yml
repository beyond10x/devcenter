name: Promote Agent Platform 0.5.3

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  VERSION: 0.5.3
  SOURCE_COMMIT: a650c56c8030244c7d7ec5b1b9b5275940cd906a
  SOURCE_IMAGE: ghcr.io/beyond10x/agent-platform-service
  TARGET_IMAGE: ghcr.io/beyond10x/devcenter

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the exact released source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_object=$(gh api "/repos/beyond10x/agent-platform/git/ref/tags/${VERSION}" --jq .object)
          tag_type=$(jq -r .type <<<"${tag_object}")
          tag_sha=$(jq -r .sha <<<"${tag_object}")
          if [ "${tag_type}" = tag ]; then
            tag_sha=$(gh api "/repos/beyond10x/agent-platform/git/tags/${tag_sha}" --jq .object.sha)
          fi
          test "${tag_sha}" = "${SOURCE_COMMIT}"
          comparison=$(gh api "/repos/beyond10x/agent-platform/compare/${SOURCE_COMMIT}...main" --jq .status)
          case "${comparison}" in identical|ahead) ;; *) exit 1 ;; esac
          cargo_toml=$(gh api "/repos/beyond10x/agent-platform/contents/Cargo.toml?ref=${SOURCE_COMMIT}" --jq .content | base64 --decode)
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' <<<"${cargo_toml}" | head -1)
          test "${source_version}" = "${VERSION}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Copy, sign, and record the private runtime
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:agent-platform-${VERSION}" \
            "${SOURCE_IMAGE}:${VERSION}-amd64" \
            "${SOURCE_IMAGE}:${VERSION}-arm64"
          digest=$(docker buildx imagetools inspect \
            "${TARGET_IMAGE}:agent-platform-${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "${digest}" in sha256:*) ;; *) exit 1 ;; esac
          cosign sign --yes "${TARGET_IMAGE}@${digest}"
          test "$(gh api /orgs/beyond10x/packages/container/devcenter --jq .visibility)" = private
          jq --null-input \
            --arg version "${VERSION}" \
            --arg commit "${SOURCE_COMMIT}" \
            --arg image "${digest}" \
            '{schema:1, version:$version, source_commit:$commit, artifacts:{agent_platform_runtime:$image}}' \
            > release-manifest.json

      - name: Agent Platform release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: agent-platform
      - name: Announce the immutable Agent Platform release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh release view "${VERSION}" --repo beyond10x/agent-platform >/dev/null 2>&1; then
            echo "Agent Platform ${VERSION} already has a GitHub release" >&2
            exit 1
          fi
          gh release create "${VERSION}" release-manifest.json \
            --repo beyond10x/agent-platform \
            --verify-tag \
            --title "Agent Platform ${VERSION}" \
            --generate-notes
