name: Promote Devcenter Connectors runtime

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable component release identifier
        required: true
        type: string
      source_commit:
        description: Exact Devcenter default-branch commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: promote-devcenter-connectors-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'b10x-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the exact default-branch source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          grep -Eq '^[a-z0-9][a-z0-9.-]{0,63}$' <<<"$RELEASE_ID"
          grep -Eq '^[0-9a-f]{40}$' <<<"$SOURCE_COMMIT"
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          test "$SOURCE_COMMIT" = "$default_sha"

  images:
    needs: verify
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            agentide
            connectors
            eventlog
            identity
            service-sdk
            todo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only the Connectors release unit
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          docker buildx bake --file docker-bake.hcl connectors \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --set 'connectors.platform=${{ matrix.platform }}' \
            --set 'connectors.secrets=id=github-token,env=TOKEN' \
            --set 'connectors.labels.org.opencontainers.image.revision=${{ inputs.source_commit }}' \
            --set 'connectors.cache-from=type=gha,scope=devcenter-connectors-${{ matrix.arch }}' \
            --set 'connectors.cache-to=type=gha,mode=max,scope=devcenter-connectors-${{ matrix.arch }}' \
            --set "connectors.tags=ghcr.io/${{ github.repository_owner }}/devcenter:connectors-${RELEASE_ID}-${{ matrix.arch }}"

  manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish and sign the immutable runtime
        id: artifact
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcenter:connectors-${RELEASE_ID}"
          docker buildx imagetools create \
            --tag "$image" \
            "${image}-amd64" \
            "${image}-arm64"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcenter@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api /orgs/beyond10x/packages/container/devcenter --jq .visibility)" = private
      - name: Write immutable component manifest
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          jq --null-input \
            --arg version "$RELEASE_ID" \
            --arg commit "$SOURCE_COMMIT" \
            --arg image "$DIGEST" \
            '{schema:1, release_unit:"devcenter-connectors", version:$version, source_commit:$commit, artifacts:{devcenter_connectors:$image}}' \
            > release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devcenter-connectors-${{ inputs.release_id }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
