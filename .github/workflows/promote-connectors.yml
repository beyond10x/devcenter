name: Promote Devcenter Connectors runtime

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable component publication identifier
        required: true
        type: string
      source_commit:
        description: Exact Devcenter default-branch commit to build
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.actor == 'b10x-bot[bot]'
    uses: ./.github/workflows/release.yml
    with:
      unit: connectors
      release_id: ${{ inputs.release_id }}
      source_commit: ${{ inputs.source_commit }}
    secrets: inherit
