name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  HELM_VERSION: 3.19.0

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    secrets: inherit

  validate-version:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Match every release version
        run: |
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          chart_version=$(sed -n 's/^version: //p' deploy/charts/devcenter/Chart.yaml)
          test "$cargo_version" = "${GITHUB_REF_NAME}"
          test "$chart_version" = "${GITHUB_REF_NAME}"

  binaries:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
      - name: Authenticate Cargo git dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "ssh://git@github.com/beyond10x/"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin devcenter --bin devcenterctl --target ${{ matrix.target }}
      - name: Package binaries
        run: |
          bundle="devcenter-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$bundle"
          cp "target/${{ matrix.target }}/release/devcenter" "$bundle/"
          cp "target/${{ matrix.target }}/release/devcenterctl" "$bundle/"
          cp LICENSE README.md "$bundle/"
          tar --create --gzip --file "$bundle.tar.gz" "$bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devcenter-${{ matrix.target }}
          path: devcenter-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  images:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        id: build-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devcenter-release-amd64
          cache-to: type=gha,mode=max,scope=devcenter-release-amd64
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/devcenter:${{ github.ref_name }}
      - name: Build and publish deployment CLI image
        id: build-ctl
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ctl
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devcenter-release-amd64
          cache-to: type=gha,mode=max,scope=devcenter-release-amd64
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/devcenterctl:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable images
        run: |
          cosign sign --yes "ghcr.io/beyond10x/devcenter@${{ steps.build-server.outputs.digest }}"
          cosign sign --yes "ghcr.io/beyond10x/devcenterctl@${{ steps.build-ctl.outputs.digest }}"
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /orgs/beyond10x/packages/container/devcenter --jq .visibility)" = private
          test "$(gh api /orgs/beyond10x/packages/container/devcenterctl --jq .visibility)" = private

  chart:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Publish configuration-neutral chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/devcenter --destination /tmp
          helm push "/tmp/devcenter-${GITHUB_REF_NAME}.tgz" oci://ghcr.io/beyond10x/charts
          visibility=$(gh api "/orgs/beyond10x/packages/container/charts%2Fdevcenter" --jq .visibility)
          if [ "$visibility" != public ]; then
            echo 'The one-time chart package bootstrap is incomplete: make charts/devcenter public in Package Settings.' >&2
            exit 1
          fi

  github-release:
    needs: [binaries, images, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: devcenter-*
          merge-multiple: true
      - run: sha256sum devcenter-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            devcenter-*.tar.gz
            SHA256SUMS
