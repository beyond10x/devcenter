name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  HELM_VERSION: 3.19.0

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the provider-reported default branch tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test -n "$default_branch"
          test "$tag_sha" = "$default_sha"
      - name: Match every release version
        run: bash ci/check-version-consistency.sh "${GITHUB_REF_NAME}"

  images:
    needs: validate-version
    name: images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: server
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devcenter-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=devcenter-release-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/devcenter:${{ github.ref_name }}-${{ matrix.arch }}
      - name: Build and publish deployment CLI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ctl
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devcenter-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=devcenter-release-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/devcenterctl:${{ github.ref_name }}-${{ matrix.arch }}
      - name: Build and publish composed Connectors image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: connectors
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=devcenter-connectors-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=devcenter-connectors-release-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/devcenter:connectors-${{ github.ref_name }}-${{ matrix.arch }}

  image-manifests:
    needs: images
    runs-on: ubuntu-latest
    outputs:
      server-digest: ${{ steps.digests.outputs.server }}
      ctl-digest: ${{ steps.digests.outputs.ctl }}
      connectors-digest: ${{ steps.digests.outputs.connectors }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch manifests
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/beyond10x/devcenter:${GITHUB_REF_NAME}" \
            "ghcr.io/beyond10x/devcenter:${GITHUB_REF_NAME}-amd64" \
            "ghcr.io/beyond10x/devcenter:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools create \
            --tag "ghcr.io/beyond10x/devcenterctl:${GITHUB_REF_NAME}" \
            "ghcr.io/beyond10x/devcenterctl:${GITHUB_REF_NAME}-amd64" \
            "ghcr.io/beyond10x/devcenterctl:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools create \
            --tag "ghcr.io/beyond10x/devcenter:connectors-${GITHUB_REF_NAME}" \
            "ghcr.io/beyond10x/devcenter:connectors-${GITHUB_REF_NAME}-amd64" \
            "ghcr.io/beyond10x/devcenter:connectors-${GITHUB_REF_NAME}-arm64"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable multi-arch images
        id: digests
        run: |
          server_digest=$(docker buildx imagetools inspect \
            "ghcr.io/beyond10x/devcenter:${GITHUB_REF_NAME}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          ctl_digest=$(docker buildx imagetools inspect \
            "ghcr.io/beyond10x/devcenterctl:${GITHUB_REF_NAME}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          connectors_digest=$(docker buildx imagetools inspect \
            "ghcr.io/beyond10x/devcenter:connectors-${GITHUB_REF_NAME}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$server_digest" in sha256:*) ;; *) exit 1 ;; esac
          case "$ctl_digest" in sha256:*) ;; *) exit 1 ;; esac
          case "$connectors_digest" in sha256:*) ;; *) exit 1 ;; esac
          cosign sign --yes "ghcr.io/beyond10x/devcenter@${server_digest}"
          cosign sign --yes "ghcr.io/beyond10x/devcenterctl@${ctl_digest}"
          cosign sign --yes "ghcr.io/beyond10x/devcenter@${connectors_digest}"
          echo "server=${server_digest}" >> "$GITHUB_OUTPUT"
          echo "ctl=${ctl_digest}" >> "$GITHUB_OUTPUT"
          echo "connectors=${connectors_digest}" >> "$GITHUB_OUTPUT"
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /orgs/beyond10x/packages/container/devcenter --jq .visibility)" = private
          test "$(gh api /orgs/beyond10x/packages/container/devcenterctl --jq .visibility)" = private

  release-candidate:
    needs: [validate-version, image-manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - name: Authenticate Cargo git dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "ssh://git@github.com/beyond10x/"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Validate the complete release candidate
        env:
          SERVER_DIGEST: ${{ needs.image-manifests.outputs.server-digest }}
          CONNECTORS_DIGEST: ${{ needs.image-manifests.outputs.connectors-digest }}
        run: |
          candidate=$(mktemp -d)
          printf '%s\n' \
            'global:' \
            '  tenantId: release-candidate' \
            '  publicOrigin: https://devcenter.example.invalid' \
            'devcenter:' \
            '  image:' \
            '    repository: ghcr.io/beyond10x/devcenter' \
            "    digest: ${SERVER_DIGEST}" \
            '  database:' \
            '    existingSecret: release-candidate-database' \
            'components:' \
            '  connectors:' \
            '    enabled: true' \
            '    image:' \
            '      repository: ghcr.io/beyond10x/devcenter' \
            "      digest: ${CONNECTORS_DIGEST}" \
            'networkPolicy:' \
            '  enabled: false' > "$candidate/values.yaml"
          printf '%s\n' \
            'schema = 1' \
            '[chart]' \
            'reference = "deploy/charts/devcenter"' \
            "version = \"${GITHUB_REF_NAME}\"" \
            'digest = "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' \
            '[images.devcenter]' \
            'reference = "ghcr.io/beyond10x/devcenter"' \
            "version = \"${GITHUB_REF_NAME}\"" \
            "digest = \"${SERVER_DIGEST}\"" \
            '[images.connectors]' \
            'reference = "ghcr.io/beyond10x/devcenter"' \
            "version = \"connectors-${GITHUB_REF_NAME}\"" \
            "digest = \"${CONNECTORS_DIGEST}\"" > "$candidate/deployment.lock.toml"
          helm lint deploy/charts/devcenter --values "$candidate/values.yaml"
          cargo run --locked --bin devcenterctl -- deployment validate \
            --release devcenter \
            --namespace release-candidate \
            --chart deploy/charts/devcenter \
            --version "$GITHUB_REF_NAME" \
            --values "$candidate/values.yaml" \
            --lock "$candidate/deployment.lock.toml" \
            --require-component devcenter \
            --require-component connectors

  chart:
    needs: release-candidate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Publish configuration-neutral chart
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/devcenter --destination /tmp
          output=$(helm push "/tmp/devcenter-${GITHUB_REF_NAME}.tgz" oci://ghcr.io/beyond10x/charts 2>&1)
          printf '%s\n' "$output"
          chart_digest=$(printf '%s\n' "$output" | awk '$1 == "Digest:" {print $2}')
          case "$chart_digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "digest=${chart_digest}" >> "$GITHUB_OUTPUT"
          visibility=$(gh api "/orgs/beyond10x/packages/container/charts%2Fdevcenter" --jq .visibility)
          if [ "$visibility" != public ]; then
            echo 'The one-time chart package bootstrap is incomplete: make charts/devcenter public in Package Settings.' >&2
            exit 1
          fi

  github-release:
    needs: [image-manifests, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable release manifest
        env:
          SERVER_DIGEST: ${{ needs.image-manifests.outputs.server-digest }}
          CTL_DIGEST: ${{ needs.image-manifests.outputs.ctl-digest }}
          CONNECTORS_DIGEST: ${{ needs.image-manifests.outputs.connectors-digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          jq --null-input \
            --arg version "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg server "$SERVER_DIGEST" \
            --arg ctl "$CTL_DIGEST" \
            --arg connectors "$CONNECTORS_DIGEST" \
            --arg chart "$CHART_DIGEST" \
            '{schema:1, version:$version, source_commit:$commit, artifacts:{devcenter:$server, devcenterctl:$ctl, devcenter_connectors:$connectors, chart:$chart}}' \
            > release-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-manifest.json
