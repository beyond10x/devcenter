name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      unit:
        description: ESS output to publish (auto selects affected outputs)
        type: choice
        options: [auto, server, deployment-cli, connectors, chart]
        default: auto
      release_id:
        description: Immutable publication identifier (chart requires SemVer)
        required: true
        type: string
      source_commit:
        description: Exact default-branch commit (empty uses selected ref)
        type: string
      bootstrap:
        description: First publication, with verified empty release history
        type: boolean
        default: false
  workflow_call:
    inputs:
      unit:
        type: string
        default: auto
      release_id:
        type: string
        required: true
      source_commit:
        type: string
        required: true
      bootstrap:
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

# Serialize manifest composition so simultaneous unit releases preserve each other.
concurrency:
  group: devcenter-publication
  cancel-in-progress: false

env:
  HELM_VERSION: 3.19.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      has_images: ${{ steps.plan.outputs.has_images }}
      chart: ${{ steps.plan.outputs.chart }}
      changed: ${{ steps.plan.outputs.changed }}
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the provider-reported default branch tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          test "$(git rev-parse HEAD)" = "$default_sha"
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - name: Authenticate Cargo dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build publication policy
        run: cargo build --locked -p devcenterctl
      - name: Select affected outputs from successful immutable manifests
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          UNIT: ${{ inputs.unit || 'auto' }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          version="${RELEASE_ID:-$GITHUB_REF_NAME}"
          bash ci/publication-history.sh history.json "$version"
          tag="$GITHUB_REF_NAME"
          if [ -n "$RELEASE_ID" ]; then tag="publication-${RELEASE_ID}"; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            bash ci/check-version-consistency.sh "$version"
          else
            bash ci/check-version-consistency.sh
          fi
          extra=()
          if [ "$BOOTSTRAP" = true ]; then extra+=(--bootstrap); fi
          target/debug/devcenterctl release plan \
            --history history.json --version "$version" --unit "$UNIT" "${extra[@]}" > publication-plan.json
          images=$(jq -c '[.selected[] as $name | select(.outputs[$name].kind == "oci_image") | $name]' publication-plan.json)
          matrix=$(jq -cn --argjson units "$images" '{include: [$units[] as $unit | ["amd64","arm64"][] as $arch | {unit:$unit, arch:$arch, platform:("linux/"+$arch), runner:(if $arch == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)}]}')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "image_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_images=$(jq 'length > 0' <<<"$images")" >> "$GITHUB_OUTPUT"
          echo "chart=$(jq '.selected | index("chart") != null' publication-plan.json)" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq '.selected | length > 0' publication-plan.json)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          jq '{selected, reused}' publication-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-plan
          path: |
            publication-plan.json
            target/debug/devcenterctl
          if-no-files-found: error

  images:
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    name: ${{ matrix.unit }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.image_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            identity
            agent-platform
            connectors
            eventlog
            service-sdk
            todo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish selected ESS image output
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          UNIT: ${{ matrix.unit }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image=$(bash ci/publication-image.sh "$UNIT" "$VERSION")
          bash ci/publication-tag-absent.sh "${image}-${ARCH}"
          docker buildx bake --file docker-bake.hcl "$UNIT" \
            --push --provenance=mode=max --sbom=true \
            --set "${UNIT}.platform=${PLATFORM}" \
            --set "${UNIT}.secrets=id=github-token,env=TOKEN" \
            --set "${UNIT}.labels.org.opencontainers.image.revision=${SOURCE}" \
            --set "${UNIT}.cache-from=type=gha,scope=devcenter-${UNIT}-${ARCH}" \
            --set "${UNIT}.cache-to=type=gha,mode=max,scope=devcenter-${UNIT}-${ARCH}" \
            --set "${UNIT}.tags=${image}-${ARCH}"

  image-manifests:
    needs: [plan, images]
    if: needs.plan.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish, sign and record immutable output
        env:
          UNIT: ${{ matrix.unit }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(bash ci/publication-image.sh "$UNIT" "$VERSION")
          bash ci/publication-tag-absent.sh "$image"
          docker buildx imagetools create --tag "$image" "${image}-amd64" "${image}-arm64"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          reference="${image%:*}"
          cosign sign --yes "${reference}@${digest}"
          package="${reference##*/}"
          test "$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}" --jq .visibility)" = private
          jq -n --arg unit "$UNIT" --arg version "$VERSION" --arg source "$SOURCE" --arg digest "$digest" \
            '{($unit):{version:$version, source_commit:$source, digest:$digest}}' > "receipt-${UNIT}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: receipt-${{ matrix.unit }}
          path: receipt-*.json
          if-no-files-found: error

  chart:
    needs: plan
    if: needs.plan.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish the selected chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          bash ci/publication-tag-absent.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/devcenter:${VERSION}"
          helm lint deploy/charts/devcenter --values deploy/charts/devcenter/ci/test-values.yaml
          bash ci/check-chart-rollouts.sh
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/charts/devcenter --version "$VERSION" --destination /tmp
          output=$(helm push "/tmp/devcenter-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts" 2>&1)
          printf '%s\n' "$output"
          digest=$(awk '$1 == "Digest:" {print $2}' <<<"$output")
          test "$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/charts%2Fdevcenter" --jq .visibility)" = public
          jq -n --arg version "$VERSION" --arg source "$SOURCE" --arg digest "$digest" \
            '{chart:{version:$version, source_commit:$source, digest:$digest}}' > receipt-chart.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: receipt-chart
          path: receipt-chart.json
          if-no-files-found: error

  github-release:
    needs: [plan, image-manifests, chart]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
      (needs.plan.outputs.has_images != 'true' || needs.image-manifests.result == 'success') &&
      (needs.plan.outputs.chart != 'true' || needs.chart.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Install Helm for immutable composition validation
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-plan
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-*
          path: receipts
          merge-multiple: true
      - name: Publish a durable manifest only after all selected outputs succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          chmod +x candidate/target/debug/devcenterctl
          jq -s 'reduce .[] as $receipt ({}; . * $receipt)' receipts/*.json > receipts.json
          candidate/target/debug/devcenterctl release complete \
            --plan candidate/publication-plan.json --receipts receipts.json > release-manifest.json
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash ci/publication-candidate.sh release-manifest.json candidate/target/debug/devcenterctl
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE" \
            --title "Devcenter publication ${VERSION}" --generate-notes release-manifest.json
