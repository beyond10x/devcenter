[workspace]
resolver = "3"
members = [
    "crates/devcenter-auth",
    "crates/devcenter-core",
    "crates/devcenter-web-assets",
    "crates/devcenter-http",
    "crates/devcenter-mcp",
    "crates/devcenter-store",
    "crates/devcenter-app",
    "crates/devcenterctl",
]
exclude = ["crates/devcenter-connectors"]

[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[workspace.dependencies]
devcenter-core = { path = "crates/devcenter-core" }
devcenter-auth = { path = "crates/devcenter-auth" }
devcenter-web-assets = { path = "crates/devcenter-web-assets" }
devcenter-http = { path = "crates/devcenter-http" }
devcenter-mcp = { path = "crates/devcenter-mcp" }
devcenter-store = { path = "crates/devcenter-store" }
identity-client = { git = "ssh://git@github.com/beyond10x/identity.git", tag = "0.3.2" }
agent-platform-client = { git = "ssh://git@github.com/beyond10x/agent-platform.git", rev = "b7dc199b7b5b2e97b84b074f2f825140775083f2" }
agent-platform-core = { git = "ssh://git@github.com/beyond10x/agent-platform.git", rev = "b7dc199b7b5b2e97b84b074f2f825140775083f2" }
connectors-client = { git = "ssh://git@github.com/beyond10x/connectors.git", rev = "8100d9bfbfe39c844dc7c0226db94d44d24cb55e" }
connectors-protocol = { package = "protocol", git = "ssh://git@github.com/beyond10x/connectors.git", rev = "8100d9bfbfe39c844dc7c0226db94d44d24cb55e" }
workspace-client = { git = "ssh://git@github.com/beyond10x/workspace.git", rev = "8cbab51f170d7bf0398ae2ccce2497a8f536d3fb" }
workspace-core = { git = "ssh://git@github.com/beyond10x/workspace.git", rev = "8cbab51f170d7bf0398ae2ccce2497a8f536d3fb" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "sqlite", "postgres"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
walkdir = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
