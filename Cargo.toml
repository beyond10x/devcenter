[workspace]
resolver = "3"
members = [
    "crates/devcenter-auth",
    "crates/devcenter-core",
    "crates/devcenter-docs",
    "crates/devcenter-http",
    "crates/devcenter-app",
    "crates/devcenterctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[workspace.dependencies]
devcenter-core = { path = "crates/devcenter-core" }
devcenter-auth = { path = "crates/devcenter-auth" }
devcenter-docs = { path = "crates/devcenter-docs" }
devcenter-http = { path = "crates/devcenter-http" }

anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
