[workspace]
resolver = "3"
members = [
    "crates/devcenter-auth",
    "crates/devcenter-core",
    "crates/devcenter-web-assets",
    "crates/devcenter-http",
    "crates/devcenter-mcp",
    "crates/devcenter-store",
    "crates/devcenter-app",
    "crates/devcenterctl",
]
exclude = ["crates/devcenter-connectors"]

[workspace.package]
version = "0.8.21"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Free-Trial-1.0.0"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[workspace.dependencies]
devcenter-core = { path = "crates/devcenter-core" }
devcenter-auth = { path = "crates/devcenter-auth" }
devcenter-web-assets = { path = "crates/devcenter-web-assets" }
devcenter-http = { path = "crates/devcenter-http" }
devcenter-mcp = { path = "crates/devcenter-mcp" }
devcenter-store = { path = "crates/devcenter-store" }
identity-client = { git = "https://github.com/beyond10x/identity.git", rev = "e3231bc34eb65695ba0486e1bbe3a0f1ec5b2a23" }
agent-platform-client = { git = "https://github.com/beyond10x/agent-platform.git", tag = "0.6.7" }
agent-platform-core = { git = "https://github.com/beyond10x/agent-platform.git", tag = "0.6.7" }
# Agent Platform 0.6.7's public coding-turn type still names AgentIDE 0.2.1. Keep this exact
# boundary aligned until Platform publishes a newer client; the hosted renderer and generated
# AgentIDE service below consume the current 0.3.1 release independently.
agentide-contracts = { git = "https://github.com/beyond10x/agentide.git", tag = "0.2.1" }
connectors-client = { git = "https://github.com/beyond10x/connectors.git", rev = "dbdd285c629d8b93bb685cc5a89a270316978ce5", version = "=0.6.4" }
connectors-protocol = { package = "protocol", git = "https://github.com/beyond10x/connectors.git", rev = "dbdd285c629d8b93bb685cc5a89a270316978ce5", version = "=0.6.4" }
service-http = { git = "https://github.com/beyond10x/service-sdk.git", rev = "f57255a2886cae3ace2a3a35935e8f1fd91a5fd4" }
workflow-generated-service = { git = "https://github.com/beyond10x/workflow.git", rev = "77c204b4d7a913cdc26e7d3445229571bad84f9a", default-features = false }
workspace-client = { git = "https://github.com/beyond10x/workspace.git", rev = "f348e3f3e6302e81b09cd4eda1d70affbe24a392", version = "=0.2.19" }
workspace-core = { git = "https://github.com/beyond10x/workspace.git", rev = "f348e3f3e6302e81b09cd4eda1d70affbe24a392", version = "=0.2.19" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "sqlite", "postgres"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
walkdir = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
