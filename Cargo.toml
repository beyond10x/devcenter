[workspace]
resolver = "3"
members = [
    "crates/devcenter-auth",
    "crates/devcenter-core",
    "crates/devcenter-docs",
    "crates/devcenter-http",
    "crates/devcenter-app",
    "crates/devcenterctl",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[workspace.dependencies]
devcenter-core = { path = "crates/devcenter-core" }
devcenter-auth = { path = "crates/devcenter-auth" }
devcenter-docs = { path = "crates/devcenter-docs" }
devcenter-http = { path = "crates/devcenter-http" }
identity-client = { git = "ssh://git@github.com/beyond10x/identity.git", tag = "0.3.2" }
agent-platform-client = { git = "ssh://git@github.com/beyond10x/agent-platform.git", tag = "0.3.1" }
connectors-client = { git = "ssh://git@github.com/beyond10x/connectors.git", tag = "v0.3.2" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
walkdir = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
