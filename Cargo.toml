[workspace]
resolver = "3"
members = [
    "crates/devcenter-auth",
    "crates/devcenter-core",
    "crates/devcenter-web-assets",
    "crates/devcenter-http",
    "crates/devcenter-mcp",
    "crates/devcenter-store",
    "crates/devcenter-app",
    "crates/devcenterctl",
]
exclude = ["crates/devcenter-connectors"]

[workspace.package]
version = "0.8.10"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Free-Trial-1.0.0"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[workspace.dependencies]
devcenter-core = { path = "crates/devcenter-core" }
devcenter-auth = { path = "crates/devcenter-auth" }
devcenter-web-assets = { path = "crates/devcenter-web-assets" }
devcenter-http = { path = "crates/devcenter-http" }
devcenter-mcp = { path = "crates/devcenter-mcp" }
devcenter-store = { path = "crates/devcenter-store" }
identity-client = { git = "ssh://git@github.com/beyond10x/identity.git", tag = "0.5.6" }
agent-platform-client = { git = "ssh://git@github.com/beyond10x/agent-platform.git", rev = "fa5b697f0931f26cd8dd3968a62e02927307bab9" }
agent-platform-core = { git = "ssh://git@github.com/beyond10x/agent-platform.git", rev = "fa5b697f0931f26cd8dd3968a62e02927307bab9" }
agentide-contracts = { git = "https://github.com/beyond10x/agentide.git", rev = "c25e73330fc130895d8f1538c9746858a265186b" }
connectors-client = { git = "ssh://git@github.com/beyond10x/connectors.git", tag = "v0.5.4" }
connectors-protocol = { package = "protocol", git = "ssh://git@github.com/beyond10x/connectors.git", tag = "v0.5.4" }
workspace-client = { git = "ssh://git@github.com/beyond10x/workspace.git", rev = "e087b6eee510f15cfea2f49462da235de9309525" }
workspace-core = { git = "ssh://git@github.com/beyond10x/workspace.git", rev = "e087b6eee510f15cfea2f49462da235de9309525" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "sqlite", "postgres"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
walkdir = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
