[workspace]
resolver = "3"
members = ["."]

[package]
name = "devcenter-connectors"
version = "0.5.8"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[[bin]]
name = "devcenter-connectors"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
connectors-runtime = { git = "https://github.com/beyond10x/connectors.git", rev = "c3f7cd952e7776e5496e4d369443a819daa15c44" }
connectors-service = { package = "service", git = "https://github.com/beyond10x/connectors.git", rev = "c3f7cd952e7776e5496e4d369443a819daa15c44" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
service-connectors = { git = "https://github.com/beyond10x/service-sdk.git", rev = "2f2aa84fbf4eed2dd4e171151eb8637c0a3a0902" }
todo-generated-service = { git = "https://github.com/beyond10x/todo.git", rev = "7ab0b68ad1c7e3e0afbbc3d1811b8a28cdc55e8b" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
