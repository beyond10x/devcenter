[workspace]
resolver = "3"
members = ["."]

[package]
name = "devcenter-connectors"
version = "0.8.16"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Free-Trial-1.0.0"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[[bin]]
name = "devcenter-connectors"
path = "src/main.rs"

[dependencies]
agentide-generated-service = { git = "https://github.com/beyond10x/agentide.git", rev = "d7940e80bcc59dbdbe6c29382821ae3f074a1070" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
connectors-runtime = { git = "https://github.com/beyond10x/connectors.git", rev = "54f4d6d00ff92c1a2fba0f06ea1dbecf44cdf12a", default-features = false }
connectors-service = { package = "service", git = "https://github.com/beyond10x/connectors.git", rev = "54f4d6d00ff92c1a2fba0f06ea1dbecf44cdf12a" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
service-catalog = { git = "https://github.com/beyond10x/service-sdk.git", rev = "19bfaca7eb0eae127fd42d004cd01ebbce406a83" }
service-connectors = { git = "https://github.com/beyond10x/service-sdk.git", rev = "19bfaca7eb0eae127fd42d004cd01ebbce406a83" }
todo-generated-service = { git = "https://github.com/beyond10x/todo.git", rev = "45f968dfb6fc254bcf6b2eaa75ce00c4d2fa5af6" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
