[workspace]
resolver = "3"
members = ["."]

[package]
name = "devcenter-connectors"
version = "0.8.13"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Free-Trial-1.0.0"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[[bin]]
name = "devcenter-connectors"
path = "src/main.rs"

[dependencies]
agentide-generated-service = { git = "https://github.com/beyond10x/agentide.git", rev = "efe595b07a430e0757e991be6eef60c02439b4f4" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
connectors-runtime = { git = "https://github.com/beyond10x/connectors.git", rev = "e162cbf4fa45f5938545798fc667cea9f21de85f", default-features = false }
connectors-service = { package = "service", git = "https://github.com/beyond10x/connectors.git", rev = "e162cbf4fa45f5938545798fc667cea9f21de85f" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
service-catalog = { git = "https://github.com/beyond10x/service-sdk.git", rev = "084defb7bf2960b9888db42feb9f009c1a78d4e4" }
service-connectors = { git = "https://github.com/beyond10x/service-sdk.git", rev = "084defb7bf2960b9888db42feb9f009c1a78d4e4" }
todo-generated-service = { git = "https://github.com/beyond10x/todo.git", rev = "d5d23da432bae9d4ad953338fa84219dc8111e8e" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
