[workspace]
resolver = "3"
members = ["."]

[package]
name = "devcenter-connectors"
version = "0.8.26"
edition = "2024"
rust-version = "1.98"
license = "PolyForm-Free-Trial-1.0.0"
repository = "https://github.com/beyond10x/devcenter"
publish = false

[[bin]]
name = "devcenter-connectors"
path = "src/main.rs"

[dependencies]
agentide-generated-service = { git = "https://github.com/beyond10x/agentide.git", rev = "176a57f58457a7c16f105584c66964263b3c2e41" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
connectors-runtime = { git = "ssh://git@github.com/beyond10x/connectors.git", rev = "fe3541a6d866e84855dfdc19ec4d22a7e779b1e5", default-features = false }
connectors-service = { package = "service", git = "ssh://git@github.com/beyond10x/connectors.git", rev = "fe3541a6d866e84855dfdc19ec4d22a7e779b1e5" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
service-catalog = { git = "https://github.com/beyond10x/service-sdk.git", rev = "0118bd3f9d63ead5d525fb39324b1e5e13c4ab1a" }
service-connectors = { git = "https://github.com/beyond10x/service-sdk.git", rev = "0118bd3f9d63ead5d525fb39324b1e5e13c4ab1a" }
todo-generated-service = { git = "https://github.com/beyond10x/todo.git", rev = "dba6069cfcdd145a1bf25ea63f7762e1cc0b7e75" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# The released generated-service SDK pins the preceding Connectors revision.
# Unify its shared contracts with the repaired runtime at the same exact source.
# Cargo requires a distinct source URL for a Git patch; delivery authenticates both transports.
[patch."https://github.com/beyond10x/connectors.git"]
protocol = { git = "ssh://git@github.com/beyond10x/connectors.git", rev = "fe3541a6d866e84855dfdc19ec4d22a7e779b1e5" }
service = { git = "ssh://git@github.com/beyond10x/connectors.git", rev = "fe3541a6d866e84855dfdc19ec4d22a7e779b1e5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
