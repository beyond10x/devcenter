global:
  tenantId: tenant-example
  publicOrigin: https://devcenter.example.invalid
devcenter:
  features:
    agentideWorkspace:
      enabled: true
  image:
    repository: registry.example.invalid/devcenter
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  database:
    existingSecret: example-devcenter-database
components:
  identity:
    enabled: true
    podSecurityContext: {fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
    image:
      repository: registry.example.invalid/identity
      digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    env:
      IDENTITY_TENANT_ID: tenant-example
    persistence:
      enabled: true
      storageClass: standard
  connectors:
    enabled: true
    image:
      repository: registry.example.invalid/connectors
      digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    args: [serve-hosted, --config, /etc/devcenter-component/hosted.toml]
    configFiles:
      hosted.toml: |
        tenant_id = "tenant-example"
    volumes:
      - name: example-ca
        secret: {secretName: example-ca}
    volumeMounts:
      - name: example-ca
        mountPath: /etc/example-ca
        readOnly: true
    persistence:
      enabled: true
      storageClass: standard
  secrets:
    enabled: true
    image:
      repository: ghcr.io/beyond10x/secrets
      digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
  agent-platform:
    enabled: true
    image:
      repository: registry.example.invalid/agent-platform
      digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    args: [serve, --listen, 0.0.0.0:8090]
    persistence:
      enabled: true
      storageClass: standard
  aep-service:
    enabled: true
    image:
      repository: registry.example.invalid/aep-service
      digest: sha256:acacacacacacacacacacacacacacacacacacacacacacacacacacacacacacacac
    args: [serve, --bind, 0.0.0.0:8080, --realm, engineering, --workspace, central, --schema, engineering, --definitions, /definitions, --definition-digest, aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
    env:
      AEP_DATABASE_URL: "postgresql://example.invalid/aep"
  workflow:
    enabled: true
    image:
      repository: registry.example.invalid/workflow
      digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  llmgw:
    enabled: true
    image:
      repository: registry.example.invalid/llmgw
      digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  workspace:
    enabled: true
    image:
      repository: registry.example.invalid/workspace
      digest: sha256:abababababababababababababababababababababababababababababababab
    env:
      WORKSPACE_DATABASE_URL: "sqlite::memory:"
      WORKSPACE_PROJECT_AGENT_MODEL: "default"
      WORKSPACE_AEP_REALM: "engineering"
      WORKSPACE_AEP_WORKSPACE: "central"
connectorsGitFetch:
  enabled: true
  sourceName: gitlab
  tls:
    existingSecret: example-connectors-git-fetch-tls
  trustRoots:
    existingSecret: example-connectors-git-fetch-ca
substrate:
  enabled: true
  image:
    repository: registry.example.invalid/substrate
    digest: sha256:cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
  volumePermissions:
    image:
      repository: registry.example.invalid/volume-permissions
      digest: sha256:dededededededededededededededededededededededededededededededededede
  tls:
    existingSecret: example-substrate-tls
  hostedIdentity:
    origin: https://identity.example.invalid
secrets:
  database:
    existingSecret: example-secrets-database
  keyring:
    existingSecret: example-secrets-keyring
  postgresql:
    enabled: true
    image:
      repository: postgres
      digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
