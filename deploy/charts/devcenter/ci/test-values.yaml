global:
  tenantId: tenant-example
  publicOrigin: https://devcenter.example.invalid
devcenter:
  image:
    repository: registry.example.invalid/devcenter
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
components:
  identity:
    enabled: true
    image:
      repository: registry.example.invalid/identity
      digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    env:
      IDENTITY_TENANT_ID: tenant-example
    persistence:
      enabled: true
      storageClass: standard
  connectors:
    enabled: true
    image:
      repository: registry.example.invalid/connectors
      digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    args: [serve-hosted, --config, /etc/devcenter-component/hosted.toml]
    configFiles:
      hosted.toml: |
        tenant_id = "tenant-example"
    volumes:
      - name: example-ca
        secret: {secretName: example-ca}
    volumeMounts:
      - name: example-ca
        mountPath: /etc/example-ca
        readOnly: true
    persistence:
      enabled: true
      storageClass: standard
  agent-platform:
    enabled: true
    image:
      repository: registry.example.invalid/agent-platform
      digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    args: [serve, --listen, 0.0.0.0:8090]
