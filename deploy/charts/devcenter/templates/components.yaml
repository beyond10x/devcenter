{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $claimName := default (printf "%s-%s" (include "devcenter.fullname" $) $name) $component.persistence.claimName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devcenter.workloadName" $ }}-{{ $name }}
  labels:
    {{- include "devcenter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ default 1 $component.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      {{- if or $component.configFiles (eq $name "secrets") }}
      annotations:
        {{- if $component.configFiles }}
        checksum/component-config: {{ toJson $component.configFiles | sha256sum | quote }}
        {{- end }}
        {{- if eq $name "secrets" }}
        checksum/secrets-workloads: {{ include "devcenter.secretsWorkloadGrants" $ | sha256sum | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "devcenter.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $component.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if $component.serviceAccountName }}
      serviceAccountName: {{ $component.serviceAccountName }}
      {{- else if eq $name "connectors" }}
      serviceAccountName: {{ include "devcenter.fullname" $ }}-connectors
      {{- else if eq $name "secrets" }}
      serviceAccountName: {{ include "devcenter.fullname" $ }}-secrets
      {{- end }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if and (eq $name "connectors") $.Values.connectorsCatalogBundle.enabled }}
      initContainers:
        - name: catalog-bundle
          image: {{ include "devcenter.image" $.Values.connectorsCatalogBundle.image | quote }}
          imagePullPolicy: {{ $.Values.connectorsCatalogBundle.image.pullPolicy }}
          command: ["sh", "-ec", "cp -R {{ $.Values.connectorsCatalogBundle.sourcePath }}/. /catalog/"]
          volumeMounts: [{name: connector-catalog, mountPath: /catalog}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "devcenter.image" $component.image | quote }}
          imagePullPolicy: {{ $component.image.pullPolicy }}
          {{- with $component.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports: [{name: http, containerPort: {{ $component.port }}, protocol: TCP}]
          {{- if or $component.env $component.envValueFrom (eq $name "secrets") (eq $name "workspace") (eq $name "workflow") (eq $name "agent-platform") (eq $name "aep-service") }}
          env:
            {{- range $key, $value := $component.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $valueFrom := $component.envValueFrom }}
            - name: {{ $key }}
              valueFrom: {{ toYaml $valueFrom | nindent 16 }}
            {{- end }}
            {{- if eq $name "secrets" }}
            - name: SECRETS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "secrets.database.existingSecret is required" $.Values.secrets.database.existingSecret }}, key: {{ $.Values.secrets.database.databaseUrlKey }}}}
            - name: SECRETS_KEYRING_FILE
              value: /etc/secrets-keyring/keyring.json
            - name: SECRETS_IDENTITY_ORIGIN
              value: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "identity").port | quote }}
            - name: SECRETS_IDENTITY_AUDIENCE
              value: {{ $.Values.secrets.identityAudience | quote }}
            - name: SECRETS_WORKLOAD_AUDIENCE
              value: {{ $.Values.secrets.workloadAudience | quote }}
            - name: SECRETS_WORKLOAD_GRANTS_FILE
              value: /etc/secrets-workloads/grants.json
            {{- end }}
            {{- if eq $name "workspace" }}
            - name: WORKSPACE_IDENTITY_ORIGIN
              value: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "identity").port | quote }}
            - name: WORKSPACE_IDENTITY_AUDIENCE
              value: "urn:b10x:workspace"
            - name: WORKSPACE_CONNECTORS_API_BASE
              value: {{ printf "http://%s-connectors.%s.svc.cluster.local:%v/api/connectors/v1" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "connectors").port | quote }}
            {{- if $.Values.substrate.enabled }}
            - name: WORKSPACE_SUBSTRATE_ORIGIN
              value: {{ printf "https://%s-substrate.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace $.Values.substrate.port | quote }}
            - name: WORKSPACE_SUBSTRATE_SERVER_IDENTITY
              value: {{ default (printf "%s-substrate.%s.svc.cluster.local" (include "devcenter.fullname" $) $.Release.Namespace) $.Values.substrate.client.serverIdentity | quote }}
            - name: WORKSPACE_SUBSTRATE_CA_BUNDLE
              value: {{ ternary "/etc/workspace/substrate/ca.crt" $.Values.substrate.client.trustRoots.path (not (empty $.Values.substrate.client.trustRoots.existingSecret)) | quote }}
            {{- end }}
            {{- if and (index $.Values.components "agent-platform").enabled (hasKey ($component.env | default dict) "WORKSPACE_PROJECT_AGENT_MODEL") }}
            - name: WORKSPACE_AGENT_PLATFORM_ORIGIN
              value: {{ printf "http://%s-agent-platform.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "agent-platform").port | quote }}
            {{- end }}
            {{- if and (index $.Values.components "aep-service").enabled (hasKey ($component.env | default dict) "WORKSPACE_AEP_REALM") (hasKey ($component.env | default dict) "WORKSPACE_AEP_WORKSPACE") }}
            - name: WORKSPACE_AEP_SERVICE_ORIGIN
              value: {{ printf "http://%s-aep-service.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "aep-service").port | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $name "workflow" }}
            - name: WORKFLOW_IDENTITY_ORIGIN
              value: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "identity").port | quote }}
            - name: WORKFLOW_IDENTITY_AUDIENCE
              value: "urn:b10x:workflow"
            {{- end }}
            {{- if eq $name "agent-platform" }}
            {{- if and (index $.Values.components "identity").enabled (not (hasKey ($component.env | default dict) "AGENT_PLATFORM_IDENTITY_ORIGIN")) }}
            - name: AGENT_PLATFORM_IDENTITY_ORIGIN
              value: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "identity").port | quote }}
            {{- end }}
            {{- if not (hasKey ($component.env | default dict) "AGENT_PLATFORM_IDENTITY_AUDIENCE") }}
            - name: AGENT_PLATFORM_IDENTITY_AUDIENCE
              value: "urn:b10x:agent-platform"
            {{- end }}
            {{- if and (index $.Values.components "connectors").enabled (not (hasKey ($component.env | default dict) "AGENT_PLATFORM_CONNECTORS_API_BASE")) }}
            - name: AGENT_PLATFORM_CONNECTORS_API_BASE
              value: {{ printf "http://%s-connectors.%s.svc.cluster.local:%v/api/connectors/v1" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "connectors").port | quote }}
            {{- end }}
            {{- if and (index $.Values.components "workspace").enabled (not (hasKey ($component.env | default dict) "AGENT_PLATFORM_WORKSPACE_ORIGIN")) }}
            - name: AGENT_PLATFORM_WORKSPACE_ORIGIN
              value: {{ printf "http://%s-workspace.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "workspace").port | quote }}
            {{- end }}
            {{- if and $component.persistence.enabled (not (hasKey ($component.env | default dict) "AGENT_PLATFORM_STATE_PATH")) }}
            - name: AGENT_PLATFORM_STATE_PATH
              value: {{ printf "%s/state.json" (trimSuffix "/" $component.persistence.mountPath) | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $name "aep-service" }}
            - name: AEP_IDENTITY_ORIGIN
              value: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" $) $.Release.Namespace (index $.Values.components "identity").port | quote }}
            - name: AEP_IDENTITY_AUDIENCE
              value: "urn:b10x:aep-service"
            - name: AEP_IDENTITY_TENANT
              value: {{ required "global.tenantId is required" $.Values.global.tenantId | quote }}
            {{- end }}
          {{- end }}
          {{- with $component.envFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $component.configFiles $component.persistence.enabled $component.volumeMounts (and (eq $name "connectors") $.Values.connectorsCatalogBundle.enabled) (and (eq $name "connectors") (index $.Values.components "secrets").enabled) (eq $name "secrets") (and (eq $name "workspace") $.Values.substrate.enabled $.Values.substrate.client.trustRoots.existingSecret) }}
          volumeMounts:
            {{- if $component.configFiles }}
            {{- range $path, $_ := $component.configFiles }}
            - name: component-config
              mountPath: {{ printf "/etc/devcenter-component/%s" $path | quote }}
              subPath: {{ $path | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and (eq $name "connectors") $.Values.connectorsCatalogBundle.enabled }}
            - name: connector-catalog
              mountPath: {{ $.Values.connectorsCatalogBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and (eq $name "connectors") (index $.Values.components "secrets").enabled }}
            - name: secrets-workload-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            {{- end }}
            {{- if eq $name "secrets" }}
            - name: secrets-keyring
              mountPath: /etc/secrets-keyring
              readOnly: true
            - name: secrets-workloads
              mountPath: /etc/secrets-workloads
              readOnly: true
            {{- end }}
            {{- if $component.persistence.enabled }}
            - name: component-state
              mountPath: {{ $component.persistence.mountPath }}
            {{- end }}
            {{- if and (eq $name "workspace") $.Values.substrate.enabled $.Values.substrate.client.trustRoots.existingSecret }}
            - name: substrate-ca
              mountPath: /etc/workspace/substrate
              readOnly: true
            {{- end }}
            {{- with $component.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {{ toYaml $component.readinessProbe | nindent 12 }}
          livenessProbe: {{ toYaml $component.livenessProbe | nindent 12 }}
          resources: {{ toYaml $component.resources | nindent 12 }}
      {{- if or $component.configFiles $component.persistence.enabled $component.volumes (and (eq $name "connectors") $.Values.connectorsCatalogBundle.enabled) (and (eq $name "connectors") (index $.Values.components "secrets").enabled) (eq $name "secrets") (and (eq $name "workspace") $.Values.substrate.enabled $.Values.substrate.client.trustRoots.existingSecret) }}
      volumes:
        {{- if $component.configFiles }}
        - name: component-config
          configMap: {name: {{ include "devcenter.fullname" $ }}-{{ $name }}-config}
        {{- end }}
        {{- if and (eq $name "connectors") $.Values.connectorsCatalogBundle.enabled }}
        - name: connector-catalog
          emptyDir: {}
        {{- end }}
        {{- if and (eq $name "connectors") (index $.Values.components "secrets").enabled }}
        - name: secrets-workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $.Values.secrets.workloadAudience | quote }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if eq $name "secrets" }}
        - name: secrets-keyring
          secret:
            secretName: {{ required "secrets.keyring.existingSecret is required" $.Values.secrets.keyring.existingSecret }}
            items: [{key: {{ $.Values.secrets.keyring.key }}, path: keyring.json}]
        - name: secrets-workloads
          configMap: {name: {{ include "devcenter.fullname" $ }}-secrets-workloads}
        {{- end }}
        {{- if $component.persistence.enabled }}
        - name: component-state
          persistentVolumeClaim: {claimName: {{ $claimName }}}
        {{- end }}
        {{- if and (eq $name "workspace") $.Values.substrate.enabled $.Values.substrate.client.trustRoots.existingSecret }}
        - name: substrate-ca
          secret:
            secretName: {{ required "substrate.client.trustRoots.existingSecret is required" $.Values.substrate.client.trustRoots.existingSecret }}
            items: [{key: {{ $.Values.substrate.client.trustRoots.key }}, path: ca.crt}]
        {{- end }}
        {{- with $component.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- if $component.configFiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devcenter.fullname" $ }}-{{ $name }}-config
  labels:
    {{- include "devcenter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  {{- range $path, $content := $component.configFiles }}
  {{ $path }}: |
{{ $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $component.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName }}
  labels:
    {{- include "devcenter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $component.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: {{ $component.persistence.size }}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devcenter.fullname" $ }}-{{ $name }}
  labels:
    {{- include "devcenter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}]
{{- end }}
{{- end }}
