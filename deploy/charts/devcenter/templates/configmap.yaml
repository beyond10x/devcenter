{{- $_ := required "global.tenantId is required" .Values.global.tenantId -}}
{{- $_ := required "global.publicOrigin is required" .Values.global.publicOrigin -}}
{{- if .Values.devcenter.features.agentideWorkspace.enabled -}}
{{- if not (index .Values.components "identity").enabled }}{{ fail "the AgentIDE workspace requires components.identity.enabled" }}{{ end -}}
{{- if not (index .Values.components "connectors").enabled }}{{ fail "the AgentIDE workspace requires components.connectors.enabled" }}{{ end -}}
{{- if not (index .Values.components "agent-platform").enabled }}{{ fail "the AgentIDE workspace requires components.agent-platform.enabled" }}{{ end -}}
{{- if not (index .Values.components "workspace").enabled }}{{ fail "the AgentIDE workspace requires components.workspace.enabled" }}{{ end -}}
{{- if not .Values.substrate.enabled }}{{ fail "the AgentIDE workspace requires substrate.enabled" }}{{ end -}}
{{- end -}}
{{- if .Values.connectorsGitFetch.enabled -}}
{{- if not (index .Values.components "connectors").enabled }}{{ fail "connectorsGitFetch requires components.connectors.enabled" }}{{ end -}}
{{- if not .Values.substrate.enabled }}{{ fail "connectorsGitFetch requires substrate.enabled" }}{{ end -}}
{{- if not .Values.networkPolicy.enabled }}{{ fail "connectorsGitFetch requires networkPolicy.enabled so only Substrate can reach its TLS listener" }}{{ end -}}
{{- $_ := required "connectorsGitFetch.sourceName is required" .Values.connectorsGitFetch.sourceName -}}
{{- $_ := required "connectorsGitFetch.tls.existingSecret is required" .Values.connectorsGitFetch.tls.existingSecret -}}
{{- $_ := required "connectorsGitFetch.trustRoots.existingSecret is required" .Values.connectorsGitFetch.trustRoots.existingSecret -}}
{{- end -}}
{{- if and (index .Values.components "workflow").enabled (not (index .Values.components "identity").enabled) -}}
{{- fail "the Workflow library requires components.identity.enabled" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devcenter.fullname" . }}
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
data:
  DEV_CENTER_TENANT_ID: {{ .Values.global.tenantId | quote }}
  DEV_CENTER_PUBLIC_ORIGIN: {{ .Values.global.publicOrigin | quote }}
  DEV_CENTER_LISTEN: "0.0.0.0:8080"
  DEV_CENTER_INSECURE_DEV_AUTH: "false"
  DEV_CENTER_IDENTITY_AUDIENCE: {{ .Values.devcenter.identity.audience | quote }}
  DEV_CENTER_IDENTITY_WEB_CLIENT_ID: {{ .Values.devcenter.identity.webClientId | quote }}
  DEV_CENTER_IDENTITY_REDIRECT_URI: {{ default (printf "%s/auth/sso/callback" (trimSuffix "/" .Values.global.publicOrigin)) .Values.devcenter.identity.redirectUri | quote }}
  DEV_CENTER_IDENTITY_PROVIDERS: {{ toJson .Values.devcenter.identity.providers | quote }}
  {{- with .Values.devcenter.identity.exchangeCallerId }}
  DEV_CENTER_IDENTITY_EXCHANGE_CALLER_ID: {{ . | quote }}
  {{- end }}
  DEV_CENTER_CONNECTORS_DOCS_AVAILABLE: {{ and .Values.ingress.enabled .Values.ingress.connectorDocs.enabled (index .Values.components "connectors").enabled | quote }}
  DEV_CENTER_AGENTIDE_WORKSPACE_ENABLED: {{ .Values.devcenter.features.agentideWorkspace.enabled | quote }}
  {{- if (index .Values.components "identity").enabled }}
  DEV_CENTER_IDENTITY_ORIGIN: {{ printf "http://%s-identity.%s.svc.cluster.local:%v" (include "devcenter.fullname" .) .Release.Namespace (index .Values.components "identity").port | quote }}
  {{- end }}
  {{- if (index .Values.components "agent-platform").enabled }}
  DEV_CENTER_AGENT_PLATFORM_ORIGIN: {{ printf "http://%s-agent-platform.%s.svc.cluster.local:%v" (include "devcenter.fullname" .) .Release.Namespace (index .Values.components "agent-platform").port | quote }}
  {{- end }}
  {{- if (index .Values.components "connectors").enabled }}
  DEV_CENTER_CONNECTORS_API_BASE: {{ printf "http://%s-connectors.%s.svc.cluster.local:%v/api/connectors/v1" (include "devcenter.fullname" .) .Release.Namespace (index .Values.components "connectors").port | quote }}
  {{- end }}
  {{- if (index .Values.components "workspace").enabled }}
  DEV_CENTER_WORKSPACE_ORIGIN: {{ printf "http://%s-workspace.%s.svc.cluster.local:%v" (include "devcenter.fullname" .) .Release.Namespace (index .Values.components "workspace").port | quote }}
  {{- end }}
  {{- if (index .Values.components "workflow").enabled }}
  DEV_CENTER_WORKFLOW_ORIGIN: {{ printf "http://%s-workflow.%s.svc.cluster.local:%v" (include "devcenter.fullname" .) .Release.Namespace (index .Values.components "workflow").port | quote }}
  {{- end }}
