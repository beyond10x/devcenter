{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devcenter.fullname" . }}
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          {{- if (index .Values.components "identity").enabled }}
          - path: /oauth
            pathType: Prefix
            backend:
              service: {name: {{ include "devcenter.fullname" . }}-identity, port: {name: http}}
          - path: /v1/access-authority
            pathType: Prefix
            backend:
              service: {name: {{ include "devcenter.fullname" . }}-identity, port: {name: http}}
          {{- end }}
          {{- if and .Values.ingress.connectorSetupRoutes.enabled (index .Values.components "connectors").enabled }}
          - path: /api/connectors/v1/connect-sessions
            pathType: Prefix
            backend:
              service: {name: {{ include "devcenter.fullname" . }}-connectors, port: {name: http}}
          - path: /api/connectors/v1/oauth/gitlab/callback
            pathType: Exact
            backend:
              service: {name: {{ include "devcenter.fullname" . }}-connectors, port: {name: http}}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "devcenter.fullname" . }}, port: {name: http}}
{{- end }}
