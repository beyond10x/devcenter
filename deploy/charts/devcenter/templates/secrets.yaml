{{- if (index .Values.components "secrets").enabled }}
{{- if not (index .Values.components "identity").enabled }}{{ fail "components.identity.enabled is required when Secrets is enabled" }}{{ end }}
{{- if not (index .Values.components "connectors").enabled }}{{ fail "components.connectors.enabled is required for the initial Secrets workload grant" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devcenter.fullname" . }}-secrets-workloads
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
data:
  grants.json: |
    {{- $subject := printf "system:serviceaccount:%s:%s-connectors" .Release.Namespace (include "devcenter.fullname" .) }}
    {{ list (dict "subject" $subject "tenant" .Values.global.tenantId "actions" (list "secret:abort" "secret:commit" "secret:delete" "secret:list" "secret:prepare" "secret:read_metadata" "secret:read_value" "secret:write")) | toJson | nindent 4 }}
{{- end }}

{{- if and (index .Values.components "secrets").enabled .Values.secrets.postgresql.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devcenter.workloadName" . }}-secrets-postgresql
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-postgresql
spec:
  serviceName: {{ include "devcenter.workloadName" . }}-secrets-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: secrets-postgresql
  template:
    metadata:
      labels:
        {{- include "devcenter.labels" . | nindent 8 }}
        app.kubernetes.io/component: secrets-postgresql
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "devcenter.image" .Values.secrets.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.secrets.postgresql.image.pullPolicy }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.secrets.postgresql.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.secrets.postgresql.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ required "secrets.database.existingSecret is required" .Values.secrets.database.existingSecret }}, key: {{ .Values.secrets.database.passwordKey }}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgresql, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, {{ .Values.secrets.postgresql.username }}, -d, {{ .Values.secrets.postgresql.database }}]}}
          livenessProbe: {tcpSocket: {port: postgresql}}
          resources: {{ toYaml .Values.secrets.postgresql.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.secrets.postgresql.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.secrets.postgresql.size }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devcenter.workloadName" . }}-secrets-postgresql
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets-postgresql
  ports: [{name: postgresql, port: 5432, targetPort: postgresql}]
{{- end }}
