{{- if .Values.substrate.enabled }}
{{- $tlsSecret := required "substrate.tls.existingSecret is required" .Values.substrate.tls.existingSecret }}
{{- $_ := required "substrate.hostedIdentity.origin is required" .Values.substrate.hostedIdentity.origin }}
{{- $workspaceClaim := .Values.substrate.workspaceStorage.existingClaim }}
{{- $quotas := .Values.substrate.workspaceStorage.projectQuotas }}
{{- if $quotas.enabled }}
{{- $_ := required "project quota configuration requires substrate.workspaceStorage.existingClaim" $workspaceClaim }}
{{- if lt (add1 (sub (int64 $quotas.idsEnd) (int64 $quotas.idsStart))) 128 }}
{{- fail "project quota range must contain at least 128 nonzero IDs in increasing order" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devcenter.fullname" . }}-substrate
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate
spec:
  serviceName: {{ include "devcenter.fullname" . }}-substrate
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: substrate
  template:
    metadata:
      labels:
        {{- include "devcenter.labels" . | nindent 8 }}
        app.kubernetes.io/component: substrate
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      nodeSelector: {{ toYaml .Values.substrate.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.substrate.tolerations | nindent 8 }}
      initContainers:
        - name: volume-permissions
          image: {{ include "devcenter.image" .Values.substrate.volumePermissions.image | quote }}
          imagePullPolicy: {{ .Values.substrate.volumePermissions.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              chown 0:0 /var/run/substrate-tls &&
              chmod 0700 /var/lib/substrate /var/run/substrate /var/run/substrate-tls &&
              rm -f /var/run/substrate-tls/tls.crt /var/run/substrate-tls/tls.key &&
              cp /var/run/substrate-tls-source/tls.crt /var/run/substrate-tls/tls.crt &&
              cp /var/run/substrate-tls-source/tls.key /var/run/substrate-tls/tls.key &&
              chmod 0644 /var/run/substrate-tls/tls.crt &&
              chmod 0600 /var/run/substrate-tls/tls.key &&
              chown 65532:65532 /var/run/substrate-tls/tls.crt /var/run/substrate-tls/tls.key &&
              chown 65532:65532 /var/lib/substrate /var/run/substrate /var/run/substrate-tls
              {{- if $workspaceClaim }}
              chmod 0700 /var/lib/substrate/workspaces &&
              chown 65532:65532 /var/lib/substrate/workspaces
              {{- end }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/substrate}
            {{- if $workspaceClaim }}
            - {name: workspace-data, mountPath: /var/lib/substrate/workspaces}
            {{- end }}
            - {name: runtime, mountPath: /var/run/substrate}
            - {name: tls-source, mountPath: /var/run/substrate-tls-source, readOnly: true}
            - {name: tls, mountPath: /var/run/substrate-tls}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"], add: ["CHOWN", "FOWNER"]}
      containers:
        - name: substrate
          image: {{ include "devcenter.image" .Values.substrate.image | quote }}
          imagePullPolicy: {{ .Values.substrate.image.pullPolicy }}
          {{- if $quotas.enabled }}
          command: ["/usr/local/bin/substrate-daemon-quota"]
          {{- end }}
          args:
            - --socket
            - /var/run/substrate/substrate.sock
            - --state
            - /var/lib/substrate/state.sqlite
            - --workspaces
            - /var/lib/substrate/workspaces
            - --deployment
            - {{ .Values.substrate.deployment | quote }}
            {{- if $quotas.enabled }}
            - --project-quota-ids
            - {{ printf "%v-%v" (int64 $quotas.idsStart) (int64 $quotas.idsEnd) | quote }}
            {{- end }}
            {{- if .Values.connectorsGitFetch.enabled }}
            - --git-source
            - {{ printf "%s=https://%s-connectors.%s.svc.cluster.local:%v/internal/git-fetch/" .Values.connectorsGitFetch.sourceName (include "devcenter.fullname" .) .Release.Namespace .Values.connectorsGitFetch.port | quote }}
            {{- end }}
          env:
            - {name: SUBSTRATE_TLS_LISTEN, value: {{ printf "0.0.0.0:%v" .Values.substrate.port | quote }}}
            - {name: SUBSTRATE_TLS_CERTIFICATE_CHAIN, value: /etc/substrate/tls/tls.crt}
            - {name: SUBSTRATE_TLS_PRIVATE_KEY, value: /etc/substrate/tls/tls.key}
            - {name: SUBSTRATE_HOSTED_IDENTITY_ORIGIN, value: {{ .Values.substrate.hostedIdentity.origin | quote }}}
            - {name: SUBSTRATE_HOSTED_IDENTITY_CA_BUNDLE, value: {{ ternary "/etc/substrate/identity/ca.crt" .Values.substrate.hostedIdentity.caBundle.path (not (empty .Values.substrate.hostedIdentity.caBundle.existingSecret)) | quote }}}
            {{- if .Values.connectorsGitFetch.enabled }}
            - {name: SUBSTRATE_CA_BUNDLE, value: /etc/substrate/git-fetch/ca.crt}
            {{- end }}
          ports: [{name: https, containerPort: {{ .Values.substrate.port }}}]
          volumeMounts:
            - {name: state, mountPath: /var/lib/substrate}
            {{- if $workspaceClaim }}
            - {name: workspace-data, mountPath: /var/lib/substrate/workspaces}
            {{- end }}
            - {name: runtime, mountPath: /var/run/substrate}
            - {name: tls, mountPath: /etc/substrate/tls, readOnly: true}
            {{- if .Values.substrate.hostedIdentity.caBundle.existingSecret }}
            - {name: identity-ca, mountPath: /etc/substrate/identity, readOnly: true}
            {{- end }}
            {{- if .Values.connectorsGitFetch.enabled }}
            - {name: connectors-git-fetch-ca, mountPath: /etc/substrate/git-fetch/ca.crt, subPath: ca.crt, readOnly: true}
            {{- end }}
          readinessProbe: {tcpSocket: {port: https}}
          livenessProbe: {tcpSocket: {port: https}}
          resources: {{ toYaml .Values.substrate.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # Kubernetes requires this when SYS_ADMIN is explicitly selected.
            allowPrivilegeEscalation: {{ $quotas.enabled }}
            readOnlyRootFilesystem: true
            {{- if $quotas.enabled }}
            capabilities: {drop: ["ALL"], add: ["SYS_ADMIN"]}
            {{- else }}
            capabilities: {drop: ["ALL"]}
            {{- end }}
      volumes:
        {{- if $workspaceClaim }}
        - name: workspace-data
          persistentVolumeClaim:
            claimName: {{ $workspaceClaim | quote }}
        {{- end }}
        - {name: runtime, emptyDir: {}}
        - {name: tls, emptyDir: {}}
        - name: tls-source
          secret:
            secretName: {{ $tlsSecret }}
            items:
              - {key: {{ .Values.substrate.tls.certificateKey }}, path: tls.crt}
              - {key: {{ .Values.substrate.tls.privateKeyKey }}, path: tls.key}
        {{- if .Values.substrate.hostedIdentity.caBundle.existingSecret }}
        - name: identity-ca
          secret:
            secretName: {{ .Values.substrate.hostedIdentity.caBundle.existingSecret }}
            items: [{key: {{ .Values.substrate.hostedIdentity.caBundle.key }}, path: ca.crt}]
        {{- end }}
        {{- if .Values.connectorsGitFetch.enabled }}
        - name: connectors-git-fetch-ca
          secret:
            secretName: {{ required "connectorsGitFetch.trustRoots.existingSecret is required" .Values.connectorsGitFetch.trustRoots.existingSecret }}
            items: [{key: {{ .Values.connectorsGitFetch.trustRoots.key }}, path: ca.crt}]
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.substrate.storage.className }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.substrate.storage.size }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devcenter.fullname" . }}-substrate
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: substrate
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: substrate
  ports: [{name: https, port: {{ .Values.substrate.port }}, targetPort: https}]
{{- end }}
