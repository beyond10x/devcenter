{{- if and .Values.secretStore.vault.enabled .Values.secretStore.vault.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-vault-backup
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-backup
  annotations: {{- toYaml .Values.secretStore.vault.backup.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-vault-backup
  labels:
    {{- include "devcenter.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-backup
spec:
  schedule: {{ .Values.secretStore.vault.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "devcenter.labels" . | nindent 12 }}
            app.kubernetes.io/component: vault-backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-vault-backup
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          containers:
            - name: backup
              image: {{ include "devcenter.image" .Values.secretStore.vault.backup.image | quote }}
              imagePullPolicy: {{ .Values.secretStore.vault.backup.image.pullPolicy }}
              args:
                - vault
                - backup
                - --address
                - {{ printf "https://%s-vault.%s.svc:8200" .Release.Name .Release.Namespace | quote }}
                - --ca-file
                - /etc/devcenter-vault/ca.crt
                - --role
                - {{ .Release.Name }}-vault-backup
                - --bucket
                - {{ .Values.secretStore.vault.backup.bucket | quote }}
                - --prefix
                - {{ .Values.secretStore.vault.backup.prefix | quote }}
                - --region
                - {{ .Values.secretStore.vault.backup.region | quote }}
              volumeMounts:
                - {name: vault-ca, mountPath: /etc/devcenter-vault, readOnly: true}
              resources: {{- toYaml .Values.secretStore.vault.backup.resources | nindent 16 }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumes:
            - name: vault-ca
              secret:
                secretName: {{ default (printf "%s-vault-tls" .Release.Name) .Values.secretStore.vault.tls.existingSecret }}
                items: [{key: ca.crt, path: ca.crt}]
{{- end }}
