{{- if .Values.secretStore.vault.enabled -}}
{{- if or (not .Values.vault.global.enabled) (not .Values.vault.server.enabled) -}}
{{- fail "secretStore.vault.enabled requires the Vault dependency global and server switches" -}}
{{- end -}}
{{- if ne .Values.secretStore.vault.seal.provider "awskms" -}}
{{- fail "the hosted Vault currently requires the awskms seal provider" -}}
{{- end -}}
{{- $_ := required "secretStore.vault.seal.awsKms.region is required" .Values.secretStore.vault.seal.awsKms.region -}}
{{- $_ := required "secretStore.vault.seal.awsKms.keyId is required" .Values.secretStore.vault.seal.awsKms.keyId -}}
{{- $kmsRegion := required "VAULT_AWSKMS_SEAL_REGION is required" (index .Values.vault.server.extraEnvironmentVars "VAULT_AWSKMS_SEAL_REGION") -}}
{{- $kmsKeyId := required "VAULT_AWSKMS_SEAL_KEY_ID is required" (index .Values.vault.server.extraEnvironmentVars "VAULT_AWSKMS_SEAL_KEY_ID") -}}
{{- if ne .Values.secretStore.vault.seal.awsKms.region $kmsRegion -}}
{{- fail "secretStore.vault.seal.awsKms.region must match VAULT_AWSKMS_SEAL_REGION" -}}
{{- end -}}
{{- if ne .Values.secretStore.vault.seal.awsKms.keyId $kmsKeyId -}}
{{- fail "secretStore.vault.seal.awsKms.keyId must match VAULT_AWSKMS_SEAL_KEY_ID" -}}
{{- end -}}
{{- $_ := required "vault.server.serviceAccount.annotations eks.amazonaws.com/role-arn is required" (index .Values.vault.server.serviceAccount.annotations "eks.amazonaws.com/role-arn") -}}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[0-9a-f]{64}$" (printf "%s:%s" .Values.vault.server.image.repository .Values.vault.server.image.tag)) -}}
{{- fail "vault.server.image.tag must include an immutable sha256 digest" -}}
{{- end -}}
{{- if .Values.vault.global.tlsDisable -}}
{{- fail "Vault TLS must remain enabled" -}}
{{- end -}}
{{- if or .Values.vault.injector.enabled .Values.vault.csi.enabled .Values.vault.ui.enabled .Values.vault.server.ingress.enabled -}}
{{- fail "the internal Vault must not enable injector, CSI, UI, or Ingress" -}}
{{- end -}}
{{- if or (not .Values.vault.server.dataStorage.enabled) (not .Values.vault.server.auditStorage.enabled) -}}
{{- fail "Vault requires persistent data and audit storage" -}}
{{- end -}}
{{- $_ := required "vault.server.dataStorage.storageClass is required" .Values.vault.server.dataStorage.storageClass -}}
{{- $_ := required "vault.server.auditStorage.storageClass is required" .Values.vault.server.auditStorage.storageClass -}}
{{- if or (not .Values.vault.server.ha.enabled) (not .Values.vault.server.ha.raft.enabled) -}}
{{- fail "Vault requires integrated Raft HA mode" -}}
{{- end -}}
{{- if not (has (int .Values.vault.server.ha.replicas) (list 1 3)) -}}
{{- fail "Vault Raft replicas must be exactly one or three" -}}
{{- end -}}
{{- if or (ne .Values.vault.server.persistentVolumeClaimRetentionPolicy.whenDeleted "Retain") (ne .Values.vault.server.persistentVolumeClaimRetentionPolicy.whenScaled "Retain") -}}
{{- fail "Vault data and audit claims must be retained when the StatefulSet is deleted or scaled" -}}
{{- end -}}
{{- if not .Values.secretStore.vault.kubernetesApiCidrs -}}
{{- fail "secretStore.vault.kubernetesApiCidrs is required for TokenReview under NetworkPolicy" -}}
{{- end -}}
{{- if .Values.secretStore.vault.backup.enabled -}}
{{- $_ := required "secretStore.vault.backup.bucket is required" .Values.secretStore.vault.backup.bucket -}}
{{- $_ := required "secretStore.vault.backup.region is required" .Values.secretStore.vault.backup.region -}}
{{- $_ := required "secretStore.vault.backup service-account role annotation is required" (index .Values.secretStore.vault.backup.serviceAccount.annotations "eks.amazonaws.com/role-arn") -}}
{{- $_ := include "devcenter.image" .Values.secretStore.vault.backup.image -}}
{{- end -}}
{{- end -}}
