global:
  tenantId: ""
  publicOrigin: ""
  imagePullSecrets: []
  podLabels: {}

devcenter:
  enabled: true
  replicaCount: 1
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  envFrom: []
  identity:
    audience: urn:b10x:devcenter
    webClientId: devcenter-web
    redirectUri: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

# Inner services are private ClusterIP workloads. Every enabled component requires an immutable
# image digest supplied by the deployment. Environment-specific configuration uses Secret and
# ConfigMap references rather than values embedded in this chart.
components:
  identity:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/identity}
  connectors:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/connectors}
  aep-service:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/aep-service}
  agent-platform:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8090
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/agent-platform}
  workflow:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/workflow}
  llmgw:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/llmgw}

connectorsCatalogBundle:
  enabled: false
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  sourcePath: /bundle
  mountPath: /var/lib/connectors/catalog

substrate:
  enabled: false
  image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  port: 8080
  storage:
    className: ""
    size: 20Gi
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations: []
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

networkPolicy:
  enabled: true
  # Required when both ingress and NetworkPolicy are enabled. These selectors identify the
  # cluster's ingress controller without baking one distribution into the chart.
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  # Connectors and model providers normally use external HTTPS APIs. Restrict this at the
  # infrastructure layer when the cluster exposes stable destination CIDRs or an egress proxy.
  allowExternalHttps: true
  # Deployment-owned destinations such as a private OIDC issuer or an existing Vault service.
  # Each entry is one ordinary NetworkPolicy egress rule.
  extraEgress: []

serviceMonitor:
  enabled: false
  interval: 30s

# The application chart owns an optional internal credential store. It is off by default so the
# public chart remains usable with an externally operated store. Deployment-specific cloud
# coordinates are required only when the AWS KMS profile is enabled.
secretStore:
  vault:
    enabled: false
    kubernetesApiCidrs: []
    tls:
      certManager:
        enabled: false
        duration: 2160h
        renewBefore: 360h
      existingSecret: ""
    seal:
      provider: awskms
      awsKms:
        region: ""
        keyId: ""
    backup:
      enabled: false
      schedule: "0 */6 * * *"
      bucket: ""
      prefix: snapshots
      region: ""
      serviceAccount:
        annotations: {}
      image:
        repository: ""
        digest: ""
        pullPolicy: IfNotPresent
      retentionDays: 30
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}

# Values consumed by the locked official HashiCorp Vault subchart. Guardrails reject an unsafe
# enabled profile. The seal key and workload role are non-secret deployment coordinates.
vault:
  global:
    enabled: true
    tlsDisable: false
  injector:
    enabled: false
  csi:
    enabled: false
  ui:
    enabled: false
  server:
    enabled: true
    image:
      repository: hashicorp/vault
      tag: 2.0.4@sha256:c18c9a2767171b273053c5bf97f93f8738337f4db92eef88b7e9b36c87d307c8
      pullPolicy: IfNotPresent
    logFormat: json
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
    ingress:
      enabled: false
    authDelegator:
      enabled: true
    serviceAccount:
      create: true
      createSecret: false
      annotations: {}
      serviceDiscovery:
        enabled: true
    service:
      enabled: true
      type: ClusterIP
      active:
        enabled: true
      standby:
        enabled: false
      instanceSelector:
        enabled: true
    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    auditStorage:
      enabled: true
      size: 2Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    volumes:
      - name: vault-tls
        secret:
          secretName: devcenter-vault-tls
    volumeMounts:
      - name: vault-tls
        mountPath: /vault/userconfig/vault-tls
        readOnly: true
    extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
      VAULT_TLS_SERVER_NAME: devcenter-vault
      VAULT_AWSKMS_SEAL_REGION: ""
      VAULT_AWSKMS_SEAL_KEY_ID: ""
    statefulSet:
      securityContext:
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    affinity: ""
    standalone:
      enabled: false
    ha:
      enabled: true
      replicas: 1
      disruptionBudget:
        enabled: false
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          disable_mlock = true

          listener "tcp" {
            tls_disable = 0
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file = "/vault/userconfig/vault-tls/tls.key"
            tls_client_ca_file = "/vault/userconfig/vault-tls/ca.crt"
          }

          seal "awskms" {}

          storage "raft" {
            path = "/vault/data"
          }

          service_registration "kubernetes" {}
