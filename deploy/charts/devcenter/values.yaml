global:
  tenantId: ""
  publicOrigin: ""
  imagePullSecrets: []
  podLabels: {}

devcenter:
  replicaCount: 1
  features:
    # The native AgentIDE workbench remains fail-closed until its deployment dependencies pass.
    agentideWorkspace:
      enabled: false
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  envFrom: []
  identity:
    audience: urn:b10x:devcenter
    webClientId: devcenter-web
    redirectUri: ""
    # Opaque Identity-owned provider IDs. Entries use {id, display_name}; empty preserves
    # Identity's existing provider flow.
    providers: []
  database:
    # Required by the chart. Hosted deployments inject a PostgreSQL URL; local non-chart execution defaults to SQLite.
    existingSecret: ""
    databaseUrlKey: database-url
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""
  connectorSetupRoutes:
    enabled: false
  # Identity's public CLI discovery and scoped access-token exchange. Keep these exact routes
  # independently opt-in; Identity still derives the actor, tenant, audience, groups, and scopes.
  identityCliRoutes:
    enabled: false
  # Identity-authenticated native Connector clients discover and call the complete hosted API at
  # this prefix. Connectors still enforces exact audience, scope, tenant, actor, and Grant policy.
  connectorClientApi:
    enabled: false
  # Operator CLI routes are sent directly to Connectors, which enforces its own exact Identity
  # audience, scope, and operator-group policy. Keep this independent from end-user setup routes.
  connectorAdminRoutes:
    enabled: false
  # Connector-owned reference routes contain no deployment credentials, but external publication
  # remains an explicit deployment choice.
  connectorDocs:
    enabled: false

# Inner services are private ClusterIP workloads. Every enabled component requires an immutable
# image digest supplied by the deployment. Environment-specific configuration uses Secret and
# ConfigMap references rather than values embedded in this chart.
components:
  identity:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/identity}
    readinessProbe: {httpGet: {path: /readyz, port: http}}
    livenessProbe: {httpGet: {path: /livez, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  connectors:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/connectors}
    readinessProbe: {httpGet: {path: /api/connectors/v1/readyz, port: http}}
    livenessProbe: {httpGet: {path: /api/connectors/v1/livez, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  secrets:
    enabled: false
    image: {repository: ghcr.io/beyond10x/secrets, digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
    args: [serve]
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/secrets}
    readinessProbe: {httpGet: {path: /health/ready, port: http}}
    livenessProbe: {httpGet: {path: /health/live, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  aep-service:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    # Kubernetes valueFrom sources, keyed by environment variable name. Use this for secret-backed
    # service configuration such as AEP_DATABASE_URL without putting credential bytes in values.
    envValueFrom: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/aep-service}
    readinessProbe: {httpGet: {path: /readyz, port: http}}
    livenessProbe: {httpGet: {path: /livez, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  agent-platform:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8090
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    # Identity, Connectors, and Workspace origins are composed automatically when their sibling
    # components are enabled. Explicit AGENT_PLATFORM_* entries here override those internal URLs.
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    # When enabled, the chart supplies AGENT_PLATFORM_STATE_PATH inside this mount so approval
    # checkpoints and task continuation survive worker restarts.
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/agent-platform}
    readinessProbe: {httpGet: {path: /livez, port: http}}
    livenessProbe: {httpGet: {path: /livez, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  workflow:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/workflow}
    readinessProbe: {tcpSocket: {port: http}}
    livenessProbe: {tcpSocket: {port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  workspace:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8094
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: [--listen, 0.0.0.0:8094]
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/workspace}
    readinessProbe: {httpGet: {path: /readyz, port: http}}
    livenessProbe: {httpGet: {path: /healthz, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  llmgw:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/llmgw}
    readinessProbe: {httpGet: {path: /readyz, port: http}}
    livenessProbe: {httpGet: {path: /livez, port: http}}
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}

connectorsCatalogBundle:
  enabled: false
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  sourcePath: /bundle
  mountPath: /var/lib/connectors/catalog

# Optional, namespace-exact in-cluster read authority for the hosted Kubernetes Connector.
# This deliberately excludes Secrets, ConfigMaps, writes, rollout restarts, and cluster-scoped
# resources. Connector policy must separately admit the same namespaces for the caller.
connectorsKubernetesAccess:
  enabled: false
  namespaces: []
  # Exact Kubernetes API endpoint CIDRs used only when networkPolicy.enabled is true.
  apiServerCidrs: []

# Secrets is composed here rather than through a standalone chart. Deployment automation creates
# both referenced Secrets: one with a PostgreSQL DSN/password and one versioned KEK keyring.
secrets:
  identityAudience: urn:b10x:secrets
  workloadAudience: urn:b10x:secrets:workload
  tokenReviewRbac:
    create: true
  database:
    existingSecret: ""
    databaseUrlKey: database-url
    passwordKey: password
  keyring:
    existingSecret: ""
    key: keyring.json
  postgresql:
    enabled: false
    image: {repository: postgres, digest: "", pullPolicy: IfNotPresent}
    database: secrets
    username: secrets
    storageClass: ""
    size: 5Gi
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}

substrate:
  enabled: false
  image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  volumePermissions:
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  port: 8443
  deployment: hosted
  tls:
    existingSecret: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
  hostedIdentity:
    origin: ""
    caBundle:
      existingSecret: ""
      key: ca.crt
      path: /etc/ssl/certs/ca-certificates.crt
  client:
    # Trust roots mounted into Workspace for the Substrate-only HTTPS client.
    trustRoots:
      existingSecret: ""
      key: ca.crt
      path: /etc/ssl/certs/ca-certificates.crt
    # Defaults to <release>-substrate.<namespace>.svc.cluster.local.
    serverIdentity: ""
  storage:
    className: ""
    size: 20Gi
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations: []
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

networkPolicy:
  enabled: true
  # Required when both ingress and NetworkPolicy are enabled. These selectors identify the
  # cluster's ingress controller without baking one distribution into the chart.
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  # Connectors and model providers normally use external HTTPS APIs. Restrict this at the
  # infrastructure layer when the cluster exposes stable destination CIDRs or an egress proxy.
  allowExternalHttps: true
  # Deployment-owned destinations such as a private OIDC issuer or an existing Vault service.
  # Each entry is one ordinary NetworkPolicy egress rule.
  extraEgress: []

serviceMonitor:
  enabled: false
  interval: 30s
