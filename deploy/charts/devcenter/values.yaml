global:
  tenantId: ""
  publicOrigin: ""
  imagePullSecrets: []
  podLabels: {}

devcenter:
  replicaCount: 1
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  envFrom: []
  identity:
    audience: urn:b10x:devcenter
    webClientId: devcenter-web
    redirectUri: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

# Inner services are private ClusterIP workloads. Every enabled component requires an immutable
# image digest supplied by the deployment. Environment-specific configuration uses Secret and
# ConfigMap references rather than values embedded in this chart.
components:
  identity:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/identity}
  connectors:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/connectors}
  secrets:
    enabled: false
    image: {repository: ghcr.io/beyond10x/secrets, digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
    args: [serve]
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/secrets}
  aep-service:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/aep-service}
  agent-platform:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8090
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/agent-platform}
  workflow:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/workflow}
  llmgw:
    enabled: false
    image: {repository: "", digest: "", pullPolicy: IfNotPresent}
    port: 8080
    replicas: 1
    serviceAccountName: ""
    podSecurityContext: {}
    args: []
    env: {}
    envFrom: []
    configFiles: {}
    volumeMounts: []
    volumes: []
    persistence: {enabled: false, storageClass: "", size: 1Gi, mountPath: /var/lib/llmgw}

connectorsCatalogBundle:
  enabled: false
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  sourcePath: /bundle
  mountPath: /var/lib/connectors/catalog

# Secrets is composed here rather than through a standalone chart. Deployment automation creates
# both referenced Secrets: one with a PostgreSQL DSN/password and one versioned KEK keyring.
secrets:
  identityAudience: urn:b10x:secrets
  workloadAudience: urn:b10x:secrets:workload
  database:
    existingSecret: ""
    databaseUrlKey: database-url
    passwordKey: password
  keyring:
    existingSecret: ""
    key: keyring.json
  postgresql:
    enabled: false
    image: {repository: postgres, digest: "", pullPolicy: IfNotPresent}
    database: secrets
    username: secrets
    storageClass: ""
    size: 5Gi
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}

substrate:
  enabled: false
  image: {repository: "", digest: "", pullPolicy: IfNotPresent}
  port: 8080
  storage:
    className: ""
    size: 20Gi
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations: []
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

networkPolicy:
  enabled: true
  # Required when both ingress and NetworkPolicy are enabled. These selectors identify the
  # cluster's ingress controller without baking one distribution into the chart.
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  # Connectors and model providers normally use external HTTPS APIs. Restrict this at the
  # infrastructure layer when the cluster exposes stable destination CIDRs or an egress proxy.
  allowExternalHttps: true
  # Deployment-owned destinations such as a private OIDC issuer or an existing Vault service.
  # Each entry is one ordinary NetworkPolicy egress rule.
  extraEgress: []

serviceMonitor:
  enabled: false
  interval: 30s
